<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Connexion — Shooting Manager</title>

  <!-- Content Security Policy (STORY 2.1) -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com;
    style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src    https://fonts.gstatic.com;
    connect-src 'self' https://accounts.google.com;
    img-src     'self' data:;
    frame-src   https://accounts.google.com;
  ">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Design system -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/login.css">

  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client"></script>
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-grid"  aria-hidden="true"></div>

<a href="index.html" class="back-link">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M19 12H5M12 5l-7 7 7 7"/>
  </svg>
  Retour
</a>

<div id="login-shell">
  <div class="login-card">

    <div class="card-ornament" aria-hidden="true">
      <div class="orn-line"></div>
      <div class="orn-dot"></div>
      <div class="orn-line"></div>
    </div>

    <div class="login-wordmark">Shoot<em>ing</em><br>Manager</div>
    <div class="login-tagline">Gestion de samples &amp; retours</div>

    <div class="login-divider"></div>

    <p class="login-desc">
      Connectez-vous avec Google pour accéder à vos shootings.<br>
      Vos données sont stockées dans votre Drive personnel.
    </p>

    <button class="btn-google" id="btn-google-login" type="button">
      <svg class="btn-google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      <span class="btn-google-text">Continuer avec Google</span>
    </button>

    <div class="login-error" id="login-error" role="alert"></div>

    <p class="login-note">
      Aucune installation · Aucune carte de crédit<br>
      <a href="index.html#features">En savoir plus sur l'app</a>
    </p>

    <div class="login-features" aria-hidden="true">
      <div class="login-feature"><div class="login-feature-dot"></div>Drive sync</div>
      <div class="login-feature"><div class="login-feature-dot"></div>Mobile-first</div>
      <div class="login-feature"><div class="login-feature-dot"></div>Zéro serveur</div>
    </div>

  </div>
</div>

<div class="login-footer">LancelotAutomotion · 2025</div>

<script src="assets/js/config.js"></script>
<script>
  const btn   = document.getElementById('btn-google-login');
  const errEl = document.getElementById('login-error');
  // tokenClient est déclaré dans config.js — pas de redéclaration ici

  function showError(msg) { errEl.textContent = msg; errEl.classList.add('visible'); }
  function hideError()    { errEl.classList.remove('visible'); }
  function setLoading(on) { btn.classList.toggle('loading', on); btn.disabled = on; }

  function handleToken(resp) {
    setLoading(false);
    if (resp.error) {
      if (resp.error !== 'access_denied') {
        showError('Erreur de connexion : ' + (resp.error_description || resp.error));
      }
      return;
    }
    sessionStorage.setItem('sm_token',        resp.access_token);
    sessionStorage.setItem('sm_token_expiry', Date.now() + (resp.expires_in || 3600) * 1000);
    window.location.href = 'app.html';
  }

  function initAuth() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID,
      scope:     CONFIG.SCOPES,
      callback:  handleToken,
    });
  }

  btn.addEventListener('click', () => {
    hideError();
    setLoading(true);
    try {
      if (!tokenClient) initAuth();
      tokenClient.requestAccessToken({ prompt: '' });
    } catch (e) {
      setLoading(false);
      showError('Impossible d\'initialiser la connexion. Rechargez la page.');
    }
  });

  window.addEventListener('load', () => {
    try { initAuth(); } catch (_) {}
    // Si déjà connecté, rediriger directement vers l'app
    const saved  = sessionStorage.getItem('sm_token');
    const expiry = sessionStorage.getItem('sm_token_expiry');
    if (saved && expiry && Date.now() < parseInt(expiry, 10)) {
      window.location.replace('app.html');
    }
  });
</script>

</body>
</html>
